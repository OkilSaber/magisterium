[package]
name = "magisterium"
version = "0.1.0"
description = "Un conseil de mages : plusieurs IA qui débattent et se relisent"
authors = ["Okil Lakhdari"]
license = "AGPL-3.0-or-later"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "magisterium_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["process", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7.19"
futures-util = "0.3.34"
uuid = { version = "1.26.1", features = ["v4"] }
which = "8.0.6"
tauri-plugin-dialog = "2.7.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls"] }
window-vibrancy = "0.8.1"
scraper = "0.27.0"
flate2 = "1.1.10"
tar = "0.4.46"
tauri-plugin-opener = "2.5.5"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Coffre de clés natif de chaque système : Trousseau (macOS), Gestionnaire
# d'identifiants (Windows), Secret Service / GNOME Keyring / KWallet (Linux).
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
